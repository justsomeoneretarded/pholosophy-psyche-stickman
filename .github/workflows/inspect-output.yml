name: Inspect encoded production output
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        default: '41687663919'
  push:
    paths: ['.github/workflows/inspect-output.yml']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        source: ['41687663919']
    env:
      SOURCE_RUN: ${{ inputs.source_run_id || matrix.source }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the production under review
        run: |
          python - <<'PY'
          import os,json,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['REPO']+'/actions/runs/'+os.environ['SOURCE_RUN']
          for _ in range(96):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})) as r:run=json.load(r)
              if run['status']=='completed':
                  if run['conclusion']!='success':raise SystemExit('Production failed; inspect its preserved diagnostics')
                  break
              time.sleep(20)
          else:raise SystemExit('Production still running; this inspection has not passed')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: philosophy-video
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: review
      - name: Inspect frames from the encoded master
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python scripts/inspect_encoded.py review
      - name: Publish inspection
        run: |
          mkdir -p inspection
          cp -r review/encoded-frames review/inspection.json inspection/
          bash scripts/publish_review.sh inspection "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$SOURCE_RUN" "$RUNNER_TEMP/inspection-publisher"
      - uses: actions/upload-artifact@v4
        with:
          name: encoded-output-inspection-${{ matrix.source }}
          path: inspection/
          retention-days: 7
