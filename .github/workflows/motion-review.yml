name: Inspect production rig in motion
# Iteration 6: a real typing device on cafe tables and lap surfaces.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/motion-review.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Render the actual production rig
        run: |
          mkdir -p motion-review
          node render/render.mjs --film examples/rig-review.json --out motion-review/rig.mp4 --width 1280 --fps 30
          ffmpeg -v error -i motion-review/rig.mp4 -f null -
          node render/render.mjs --film examples/rig-review.json --stills motion-review/frames --times "0.6,0.8,1.0,1.2,5.6,5.8,6.0,6.2,10.0,13.5,16.5,20.0,24.0,27.0,28.0,29.0,32.0,35.2,36.3,38.0,39.3,42.0,44.0" --width 960
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for p in Path('motion-review/frames').glob('*.jpg'):
              p.with_suffix('.jpg.b64').write_text(base64.b64encode(p.read_bytes()).decode())
          PY
      - name: Publish motion inspection
        run: |
          git fetch origin previews
          git worktree add -b motion-inspection "$RUNNER_TEMP/motion" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/motion/previews/rig-$GITHUB_RUN_ID"
          cp -r motion-review/* "$RUNNER_TEMP/motion/previews/rig-$GITHUB_RUN_ID/"
          cd "$RUNNER_TEMP/motion"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "previews/rig-$GITHUB_RUN_ID"
          git commit -m "Production rig motion inspection $GITHUB_RUN_ID"
          git pull --rebase origin previews
          git push origin HEAD:previews
      - uses: actions/upload-artifact@v4
        with:
          name: production-rig-motion
          path: motion-review/
          retention-days: 7
