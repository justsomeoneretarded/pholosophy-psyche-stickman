name: Revise and produce the reviewed screenplay
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/revise-production.yml']
permissions:
  contents: write
  actions: write
jobs:
  revise:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-core.txt
      - uses: actions/download-artifact@v4
        with:
          name: film-plan
          run-id: '41671268205'
          github-token: ${{ github.token }}
          path: build
      - name: Stop the obsolete production with unresolved editorial findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/actions/runs/41671268205/cancel',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try:
              urllib.request.urlopen(request,timeout=30).close()
              print('Stopped obsolete run; its screenplay checkpoint has been preserved')
          except urllib.error.HTTPError as e:
              if e.code!=409:raise
              print('Run already completed')
          PY
      - name: Resolve major story findings and recompile the timeline
        run: python scripts/revise_checkpoint.py build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-topic-writing
          path: build/
          retention-days: 7
  produce:
    needs: revise
    uses: ./.github/workflows/generate-video.yml
    with:
      title: Why Smart People Overthink Everything
      duration_minutes: '6'
      plan_source_run: ${{ github.run_id }}
    secrets: inherit
