name: Resume independent editorial and acting review
# Repair requests now include the exact supported rig contract.
on:
  workflow_dispatch:
    inputs:
      title:
        type: string
        default: What If Nothing Really Matters?
  push:
    paths: ['.github/workflows/resume-writing-review.yml']
permissions:
  contents: write
  actions: read
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TITLE: ${{ inputs.title || 'What If Nothing Really Matters?' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-core.txt
      - name: Research and write a fresh philosophical argument
        run: |
          mkdir -p build/writing
          python - <<'PY'
          import json,os
          from pathlib import Path
          from pipeline.writing.research import research
          from story.essay import stage_concept,stage_shots,stage_merge
          title=os.environ['TITLE']
          import urllib.request
          w=Path('build/writing')
          root='https://raw.githubusercontent.com/justsomeoneretarded/pholosophy-psyche-stickman/previews/previews/41744000615/writing/'
          for name in ('concept-before-editor.json','research.txt','sources.json'):
              urllib.request.urlretrieve(root+name,w/name)
          checkpoint=json.loads((w/'concept-before-editor.json').read_text())
          direction=checkpoint.get('_title') or title
          sheet=stage_concept(direction,4,w,(w/'research.txt').read_text(),reuse_draft=w/'concept-before-editor.json')
          if not all(beat.get('staging') for beat in sheet['beats']):raise SystemExit('The writer omitted structured physical staging; this benchmark did not pass')
          stage_shots(w);stage_merge(w,Path('build/film.json'))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render the model-directed acting through the production engine
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
          node render/render.mjs --film build/film.json --out build/acting-preview.mp4 --start 0 --end 20 --width 1280 --fps 30
          node render/render.mjs --film build/film.json --stills build/frames --every 25 --width 960
          ffmpeg -v error -i build/acting-preview.mp4 -f null -
          python - <<'PY'
          import base64
          from pathlib import Path
          for p in Path('build/frames').glob('*.jpg'):p.with_suffix('.jpg.b64').write_text(base64.b64encode(p.read_bytes()).decode())
          PY
      - name: Publish writing evidence
        if: always()
        run: |
          echo 'Automated repair of a preserved fresh AI draft, plus silent production-engine acting preview if successful. Not a finished narrated video.' > build/REVIEW_STATUS.txt
          bash scripts/publish_review.sh build "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$GITHUB_RUN_ID" "$RUNNER_TEMP/writing-publisher"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-topic-writing
          path: build/
          retention-days: 7
