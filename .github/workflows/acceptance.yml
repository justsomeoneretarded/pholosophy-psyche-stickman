name: Production acceptance renders
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acceptance.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: procrastination-smoke
            title: Why We Procrastinate
            minutes: 0.75
          - name: overthinking-full
            title: Why Smart People Overthink Everything
            minutes: 6
          - name: meaning-full
            title: What If Nothing Really Matters?
            minutes: 6
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OLLAMA_MODELS: ${{ github.workspace }}/.cache/ollama
      OLLAMA_NUM_PARALLEL: '1'
      STUDIO_INPUTS: '{"title": "${{ matrix.title }}", "duration_minutes": ${{ matrix.minutes }}, "seed": 42}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: |
          nproc
          free -h
          df -h .
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core zstd
          python -m pip install -r requirements.txt
          ffmpeg -version
      - uses: actions/cache@v4
        with:
          path: |
            .cache/voices
            .cache/huggingface
            .cache/ollama
          key: studio-models-v2-${{ runner.os }}
      - name: Local models
        run: |
          mkdir -p work/ollama
          curl --fail --location --retry 3 https://ollama.com/download/ollama-linux-amd64.tar.zst -o work/ollama.tar.zst
          tar --zstd --exclude='*cuda*' --exclude='*rocm*' -xf work/ollama.tar.zst -C work/ollama
          rm work/ollama.tar.zst
          work/ollama/bin/ollama serve > work/ollama.log 2>&1 &
          python scripts/wait_ollama.py
          work/ollama/bin/ollama pull qwen3:4b
          python -m piper.download_voices en_US-ljspeech-high --download-dir .cache/voices
      - name: Complete actual production pipeline
        run: python -m pipeline.main --out outputs/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.name }}
          path: |
            outputs/
            work/*.log
          retention-days: 14
          if-no-files-found: error
