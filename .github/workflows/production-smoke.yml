name: Complete procrastination smoke test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/production-smoke.yml']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage the explicit editorial regression fixture
        run: |
          mkdir -p build/writing
          cp examples/procrastination-smoke.json build/film.json
          echo '[]' > build/writing/sources.json
          echo 'An explicitly authored educational vignette. No empirical statistics or attributed quotations. This fixture tests production; fresh AI writing is tested separately.' > build/writing/research.txt
      - uses: actions/upload-artifact@v4
        with:
          name: independent-topic-writing
          path: build/
          retention-days: 7
  produce:
    needs: prepare
    uses: ./.github/workflows/generate-video.yml
    with:
      title: Why We Procrastinate
      plan_source_run: ${{ github.run_id }}
      duration_minutes: '1'
      procedural_music: true
    secrets: inherit
