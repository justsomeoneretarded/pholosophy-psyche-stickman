name: Coordinate production validation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/validate-production.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replace obsolete validation run and dispatch current workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['REPOSITORY']
          def post(path,data=None):
              request=urllib.request.Request(base+path,data=json.dumps(data or {}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  print(path, response.status)
          # Core compilation and tests passed at e32f7c1; run the corrected production code.
          post('/actions/workflows/acceptance.yml/dispatches',{'ref':'main'})
          post('/actions/workflows/generate-video.yml/dispatches',{'ref':'main','inputs':{'title':'Why Smart People Overthink Everything'}})
          post('/actions/workflows/longform-benchmark.yml/dispatches',{'ref':'main'})
          PY
