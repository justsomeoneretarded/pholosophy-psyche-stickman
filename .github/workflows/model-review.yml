name: Benchmark free model alternatives
# Iteration 4: consistent single-beat wording for the CPU probe.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/model-review.yml']
permissions:
  contents: write
  actions: write
jobs:
  quota:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-core.txt
      - name: Inspect available model quotas without exposing secrets
        run: python scripts/model_quota_review.py
      - name: Publish model access evidence
        if: always()
        run: bash scripts/publish_review.sh "$GITHUB_WORKSPACE/model-review" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$GITHUB_RUN_ID" "$RUNNER_TEMP/quota-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-model-access
          path: model-review/
          retention-days: 7
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Stop the older CPU probe before model loading
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/runs/41336314780/cancel',
              data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
          try:urllib.request.urlopen(request,timeout=30).close()
          except urllib.error.HTTPError as exc:
              if exc.code!=409:raise
          PY
      - name: Free disk space for local inference
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-core.txt
      - name: Test local Qwen 4B on actual production requests
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python scripts/cpu_writer_review.py
      - name: Publish CPU feasibility evidence
        if: always()
        run: bash scripts/publish_review.sh "$GITHUB_WORKSPACE/model-review" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$GITHUB_RUN_ID" "$RUNNER_TEMP/cpu-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-writer-feasibility
          path: model-review/
          retention-days: 7
