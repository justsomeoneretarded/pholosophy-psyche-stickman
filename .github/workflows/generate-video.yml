name: Generate Stickman Video
# One title in, one finished philosophy / psychology video essay out.
# Jobs: plan (script, Groq) -> voice (Chatterbox Turbo) -> produce (animation, mix, package)
#       music (ACE-Step 1.5) runs in parallel from the start.

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video topic or title (e.g. Nihilism - belief in nothing)
        required: true
        type: string
      narrator:
        description: Narrator voice
        type: choice
        options: [Warguy, Kit Laser, Female]
        default: Warguy
      duration_minutes:
        description: Length in minutes (Auto lets the writer choose, usually 5-8)
        type: choice
        options: [Auto, '3', '4', '5', '6', '7', '8', '10', '12']
        default: Auto
      format:
        description: Video format
        type: choice
        options: ['16:9', '9:16']
        default: '16:9'
      burn_captions:
        description: Burn narration captions into the picture (an SRT file is always included)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: video-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_MINUTES: ${{ inputs.duration_minutes }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-core.txt
      - name: Check Groq access
        id: groq
        continue-on-error: true
        run: python scripts/check_groq.py
      - name: Write the script (qwen3.8-27b on Groq, with fallbacks)
        run: python -m pipeline.essay plan --work work
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: work/plan/
          retention-days: 3
      - name: Show the script
        if: always()
        run: if [ -f work/plan/script.json ]; then python -c "import json;s=json.load(open('work/plan/script.json'));print(s['title']);[print(i+1,b['mode'],b['setpiece'],'|',b.get('narration') or b.get('on_screen','')) for i,b in enumerate(s['beats'])]"; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-plan-diagnostics
          path: work/
          retention-days: 7

  music:
    # Original score with ACE-Step 1.5 (MIT). Optional: on any failure the bundled
    # Scott Buckley tracks (CC BY 4.0) are used and credited automatically.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      ACESTEP_INIT_LLM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the music model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
      - name: Install ACE-Step 1.5 (CPU)
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5 "$RUNNER_TEMP/acestep"
          python -m pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -3
          cd "$RUNNER_TEMP/acestep"
          python - <<'INSTALL'
          import collections, subprocess, sys, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          skip = ("torch==", "torch>", "torch;", "torchvision", "torchaudio", "nano-vllm", "mlx")
          keep = [d for d in deps if not d.replace(" ", "").lower().startswith(skip) and d.split(";")[0].strip().lower() != "torch"]
          locked = collections.defaultdict(set)
          for package in tomllib.load(open("uv.lock", "rb"))["package"]:
              if "version" in package and "editable" not in package.get("source", {}) and "path" not in package.get("source", {}):
                  locked[package["name"]].add(package["version"].split("+")[0])
          pins = [f"{name}=={next(iter(versions))}" for name, versions in sorted(locked.items())
                  if len(versions) == 1 and not name.startswith(("nvidia", "triton", "nano-vllm", "flash"))]
          open("cpu-constraints.txt", "w").write("\n".join(pins) + "\n")
          for dep in keep:
              subprocess.run([sys.executable, "-m", "pip", "install", "-q", "-c", "cpu-constraints.txt", dep], capture_output=True)
          INSTALL
          python -m pip install -q --no-deps -e . 2>&1 | tail -3
      - name: Compose the contemplative score
        run: python scripts/generate_music.py "$RUNNER_TEMP/acestep" contemplative 150 work/music/contemplative.wav
      - name: Compose the hopeful score
        run: python scripts/generate_music.py "$RUNNER_TEMP/acestep" hopeful 90 work/music/hopeful.wav
      - uses: actions/upload-artifact@v4
        with:
          name: music
          path: work/music/*.wav
          if-no-files-found: ignore
          retention-days: 3

  voice:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NARRATOR: ${{ inputs.narrator }}
      TTS_MODEL: ${{ vars.TTS_MODEL || 'turbo' }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the voice model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: voice-models-v1-${{ env.TTS_MODEL }}
      - name: Install Chatterbox Turbo and faster-whisper (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-voice.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/plan
      - name: Record the narration
        run: python -m pipeline.essay voice --work work
      - uses: actions/upload-artifact@v4
        with:
          name: speech
          path: work/speech/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-voice-diagnostics
          path: work/
          retention-days: 7

  produce:
    needs: [plan, voice, music]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.voice.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write          # only to push the small review preview to the 'previews' branch
    env:
      NARRATOR: ${{ inputs.narrator }}
      VIDEO_FORMAT: ${{ inputs.format }}
      BURN_CAPTIONS: ${{ inputs.burn_captions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-core.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/plan
      - uses: actions/download-artifact@v4
        with:
          name: speech
          path: work/speech
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: music
          path: work/music
      - name: Animate, mix and package
        run: python -m pipeline.essay produce --work work --final outputs/video
      - name: Publish a small review preview to the previews branch
        if: always()
        continue-on-error: true
        run: |
          dir="previews/${{ github.run_id }}"
          mkdir -p "$RUNNER_TEMP/p/$dir"
          for f in contact-sheet.jpg thumbnail-01.jpg thumbnail-02.jpg thumbnail-03.jpg quality.json script.txt recommended-title.txt; do
            [ -f "outputs/video/$f" ] && cp "outputs/video/$f" "$RUNNER_TEMP/p/$dir/"
          done
          [ -f outputs/video/video.mp4 ] && ffmpeg -v error -y -i outputs/video/video.mp4 -t 75 -vf scale=640:-2 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 64k "$RUNNER_TEMP/p/$dir/preview-75s.mp4" || true
          cp work/FAILURE-*.txt "$RUNNER_TEMP/p/$dir/" 2>/dev/null || true
          cd "$RUNNER_TEMP/p"
          git init -q && git checkout -q -b previews
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin previews && git reset -q --soft FETCH_HEAD || true
          git add -A && git commit -q -m "Preview for run ${{ github.run_id }}: ${{ inputs.title }}" && git push -q origin previews
      - uses: actions/upload-artifact@v4
        with:
          name: philosophy-video
          path: outputs/video/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-produce-diagnostics
          path: |
            work/FAILURE-*.txt
            work/timeline.json
            work/render/segments/*.log
            outputs/
          retention-days: 7
