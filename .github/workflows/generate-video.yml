name: Generate Stickman Video
# A title in, a narrated Day One-style concept film out.
#   write   - Groq (qwen3.8-27b) invents a story that dramatizes the concept and storyboards it shot by shot
#   voice   - Chatterbox Turbo records the narration; shots stretch to fit it
#   music   - ACE-Step 1.5 composes the score (in parallel with the voice)
#   picture - the canvas engine renders the film in four parallel parts (headless Chromium)
#   finish  - sound design and mix, assembly, thumbnails, publishing files, checks, review copy

on:
  workflow_dispatch:
    inputs:
      title:
        description: Concept or title (e.g. Addiction, Heartbreak, Why we fear being alone)
        required: true
        type: string
      narrator:
        description: Narrator voice
        type: choice
        options: [Warguy, Kit Laser, Female]
        default: Warguy
      duration_minutes:
        description: Length in minutes (Auto lets the writer choose, usually 3.5-5.5)
        type: choice
        options: [Auto, '2', '3', '4', '5', '6', '7', '8']
        default: Auto
      notes:
        description: Optional direction for the writer (angle, setting, who the hero is). Leave empty to let it decide.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: video-${{ github.run_id }}

env:
  PYTHONUNBUFFERED: '1'

jobs:
  write:
    name: Write and storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
      MINUTES: ${{ inputs.duration_minutes }}
    outputs:
      duration: ${{ steps.done.outputs.duration }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -q -r requirements-core.txt
      - name: Check Groq access
        continue-on-error: true
        run: python scripts/check_groq.py
      - name: Background reading (Wikipedia)
        run: |
          mkdir -p build/writing
          python -c "import os,json;from pipeline.writing.research import research;r=research(os.environ['TITLE']);open('build/writing/research.txt','w').write(r['context']);json.dump(r['sources'],open('build/writing/sources.json','w'));print(len(r['context']),'characters',r['warnings'])"
      - name: Concept and beats
        run: |
          T="$TITLE"; if [ -n "$NOTES" ]; then T="$TITLE. Direction from the producer: $NOTES"; fi
          python story/essay.py concept --title "$T" --minutes "$MINUTES" --dir build/writing --research build/writing/research.txt
      - name: Storyboard
        run: python story/essay.py shots --dir build/writing
      - name: Assemble and check the shot list
        id: done
        run: |
          python story/essay.py merge --dir build/writing --out build/film.json
          echo "duration=$(python -c "import json;print(json.load(open('build/film.json'))['duration'])")" >> "$GITHUB_OUTPUT"
          { echo '### Story'; cat build/story.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-plan
          path: |
            build/film.json
            build/story.md
            build/writing/
          if-no-files-found: ignore
          retention-days: 3

  voice:
    name: Record the narration
    needs: write
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NARRATOR: ${{ inputs.narrator }}
      TTS_MODEL: ${{ vars.TTS_MODEL || 'turbo' }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    outputs:
      duration: ${{ steps.done.outputs.duration }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the voice model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: voice-models-v1-${{ env.TTS_MODEL }}
      - name: Install Chatterbox Turbo and faster-whisper (CPU)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r requirements-voice.txt
      - uses: actions/download-artifact@v4
        with:
          name: film-plan
          path: build
      - name: Record and fit the narration
        id: done
        run: |
          N=$(echo "$NARRATOR" | tr '[:upper:] ' '[:lower:]-')
          python audio/voice.py build/film.json build/voice --narrator "$N"
          echo "duration=$(python -c "import json;print(json.load(open('build/film.json'))['duration'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: film-final
          path: |
            build/film.json
            build/voice/vo-???-?.wav
            build/voice/verification.json
          retention-days: 3
      - name: Preserve failed voice diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-diagnostics
          path: |
            build/film.json
            build/voice/
          retention-days: 3

  music:
    name: Compose the score
    needs: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      ACESTEP_INIT_LLM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the music model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
      - uses: actions/download-artifact@v4
        with:
          name: film-plan
          path: build
      - name: Install ACE-Step 1.5 (CPU)
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5 "$RUNNER_TEMP/acestep"
          python -m pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -3
          cd "$RUNNER_TEMP/acestep"
          python - <<'INSTALL'
          import collections, subprocess, sys, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          skip = ("torch==", "torch>", "torch;", "torchvision", "torchaudio", "nano-vllm", "mlx")
          keep = [d for d in deps if not d.replace(" ", "").lower().startswith(skip) and d.split(";")[0].strip().lower() != "torch"]
          locked = collections.defaultdict(set)
          for package in tomllib.load(open("uv.lock", "rb"))["package"]:
              if "version" in package and "editable" not in package.get("source", {}) and "path" not in package.get("source", {}):
                  locked[package["name"]].add(package["version"].split("+")[0])
          pins = [f"{name}=={next(iter(versions))}" for name, versions in sorted(locked.items())
                  if len(versions) == 1 and not name.startswith(("nvidia", "triton", "nano-vllm", "flash"))]
          open("cpu-constraints.txt", "w").write("\n".join(pins) + "\n")
          for dep in keep:
              subprocess.run([sys.executable, "-m", "pip", "install", "-q", "-c", "cpu-constraints.txt", dep], capture_output=True)
          INSTALL
          python -m pip install -q --no-deps -e . 2>&1 | tail -3
      - name: Compose the film's score
        run: python audio/music.py "$RUNNER_TEMP/acestep" build/film.json build/music.wav
      - uses: actions/upload-artifact@v4
        with:
          name: film-music
          path: build/music.wav
          if-no-files-found: ignore
          retention-days: 3

  picture:
    name: Picture part ${{ matrix.part }}
    needs: voice
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: film-final
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the renderer
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Render this part
        id: render_part
        run: |
          D=${{ needs.voice.outputs.duration }}
          START=$(python3 -c "print($D*${{ matrix.part }}/4)"); END=$(python3 -c "print($D*(${{ matrix.part }}+1)/4)")
          node render/render.mjs --film build/film.json --out build/part-${{ matrix.part }}.mp4 --start $START --end $END --width 1920 --fps 30
      - name: Sound cues, contact sheet and thumbnail stills
        if: matrix.part == 0
        run: |
          node render/render.mjs --film build/film.json --cues build/cues.json
          node render/render.mjs --film build/film.json --stills build/stills --every 3 --width 640
          ffmpeg -v error -pattern_type glob -i 'build/stills/*.jpg' -vf "tile=6x12" -frames:v 1 build/contact-sheet.jpg
          POSTER_TIMES=$(python3 story/package.py --poster-times build/film.json)
          node render/render.mjs --film build/film.json --stills build/poster --times "$POSTER_TIMES" --width 1920
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.render_part.outcome == 'success' }}
        with:
          name: film-part-${{ matrix.part }}
          path: |
            build/part-*.mp4
            build/cues.json
            build/contact-sheet.jpg
            build/poster/*.jpg
          if-no-files-found: ignore
          retention-days: 3

  finish:
    name: Sound, edit and package
    needs: [voice, picture, music]
    if: ${{ !cancelled() && needs.picture.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # only to push the review copy to the 'previews' branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: film-final
          path: build
      - uses: actions/download-artifact@v4
        with:
          pattern: film-part-*
          path: build
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: film-music
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: film-plan
          path: build/plan
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          python -m pip install -q numpy scipy Pillow
      - name: Mix the soundtrack
        run: python audio/sound.py --cues build/cues.json --music build/music.wav --out build/soundtrack.wav | tee build/sound.txt
      - name: Assemble the film and the package
        run: |
          for i in 0 1 2 3; do echo "file 'part-$i.mp4'"; done > build/parts.txt
          ffmpeg -y -v error -f concat -safe 0 -i build/parts.txt -c copy build/picture.mp4
          mkdir -p out
          ffmpeg -y -v error -i build/picture.mp4 -i build/soundtrack.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 256k -shortest -movflags +faststart out/video.mp4
          python -c "import json;f=json.load(open('build/film.json'));f['music_credit']='Original score generated with ACE-Step 1.5 (MIT)' if 'ACE-Step' in open('build/sound.txt').read() else 'Synthesized score';json.dump(f,open('build/film.json','w'))"
          python story/package.py build/film.json build/poster out
          python -c "import sys,json;sys.path.insert(0,'story');from essay import script_md;from pathlib import Path;script_md(json.load(open('build/film.json')),Path('out/story.md'))"
          cp build/film.json build/contact-sheet.jpg out/
          cp build/voice/verification.json out/speech-verification.json
          cp build/plan/writing/sources.json out/sources.json
          cp build/plan/writing/research.txt out/research_notes.md
          python scripts/master_quality.py out/video.mp4 build/film.json out/quality_report.json
          ffmpeg -v error -i out/video.mp4 -f null - && echo "full decode: ok"
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact out/video.mp4 | tee build/probe.txt
          ffmpeg -v info -i out/video.mp4 -vn -af ebur128=peak=true -f null - 2>&1 | grep -E "^\s+(I|LRA|Peak):" | tee out/loudness.txt
          python -c "import json;f=json.load(open('build/film.json'));print('::notice title=Done::'+f['title']+': '+str(round(f['duration']/60,1))+' min, '+str(len(f['shots']))+' shots')"
      - name: Publish a review copy to the previews branch
        env:
          REVIEW_TITLE: ${{ inputs.title }}
        if: always()
        continue-on-error: true
        run: |
          dir="previews/${{ github.run_id }}"
          mkdir -p "$RUNNER_TEMP/p/$dir/frames"
          for f in contact-sheet.jpg thumbnail-01.jpg thumbnail-02.jpg thumbnail-03.jpg story.md film.json recommended-title.txt description.txt subtitles.srt loudness.txt; do
            [ -f "out/$f" ] && cp "out/$f" "$RUNNER_TEMP/p/$dir/"
          done
          if [ -f out/video.mp4 ]; then
            ffmpeg -v error -y -i out/video.mp4 -vf scale=854:-2 -c:v libx264 -crf 31 -preset veryfast -c:a aac -b:a 96k "$RUNNER_TEMP/p/$dir/review.mp4"
            ffmpeg -v error -y -i out/video.mp4 -vf "fps=1/2,scale=480:-2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='%{pts\\:hms}':x=6:y=6:fontsize=18:fontcolor=red,tile=4x6" "$RUNNER_TEMP/p/$dir/frames/sheet-%02d.jpg"
          fi
          cd "$RUNNER_TEMP/p"
          git init -q && git checkout -q -b previews
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin previews && git reset -q --soft FETCH_HEAD || true
          git add -A && git commit -q -m "Review copy for run $GITHUB_RUN_ID: $REVIEW_TITLE" && git push -q origin previews
      - name: Preserve failed production diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-production-diagnostics
          path: |
            out/
            build/probe.txt
            build/sound.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: philosophy-video
          path: out/
          retention-days: 7
