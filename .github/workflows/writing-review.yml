name: Benchmark bounded writing with independent topic
# Iteration 6: explicit patch field names and saved rejected proposals.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/writing-review.yml']
permissions:
  contents: write
  actions: read
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WRITER_MODELS: groq:openai/gpt-oss-20b
      STORYBOARD_MODELS: groq:openai/gpt-oss-20b
      TITLE: What If Nothing Really Matters?
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: independent-topic-writing
          run-id: '41330783972'
          github-token: ${{ github.token }}
          path: prior
      - name: Install the actual writing pipeline
        run: python -m pip install -q -r requirements-core.txt
      - name: Generate and edit a distinct philosophical script
        run: |
          mkdir -p build/writing
          python - <<'PY'
          import os,json
          from pipeline.writing.research import research
          from pathlib import Path
          r=research(os.environ['TITLE'])
          Path('build/writing/research.txt').write_text(r['context'])
          Path('build/writing/sources.json').write_text(json.dumps(r['sources']))
          PY
          python story/essay.py concept --title "$TITLE" --minutes 4 --dir build/writing --research build/writing/research.txt --reuse-draft prior/writing/concept-before-editor.json
          python story/essay.py shots --dir build/writing
          python story/essay.py merge --dir build/writing --out build/film.json
      - name: Publish actual writing evidence, including failures
        if: always()
        run: |
          git fetch origin previews
          git worktree add -b writing-inspection "$RUNNER_TEMP/writing" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/writing/previews/writing-$GITHUB_RUN_ID"
          cp -r build/* "$RUNNER_TEMP/writing/previews/writing-$GITHUB_RUN_ID/"
          cd "$RUNNER_TEMP/writing"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "previews/writing-$GITHUB_RUN_ID"
          git commit -m "Actual bounded writing evidence $GITHUB_RUN_ID"
          git pull --rebase origin previews
          git push origin HEAD:previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-topic-writing
          path: build/
          retention-days: 7
