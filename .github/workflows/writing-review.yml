name: Benchmark bounded writing with independent topic
# Iteration 10: replay completed editorial work, repair narration shapes, then test compact directing.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/writing-review.yml']
permissions:
  contents: write
  actions: read
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WRITER_MODELS: groq:openai/gpt-oss-20b
      STORYBOARD_MODELS: groq:openai/gpt-oss-20b
      REVIEW_MODELS: groq:qwen/qwen3.8-27b,groq:openai/gpt-oss-20b
      TITLE: What If Nothing Really Matters?
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: independent-topic-writing
          run-id: '41336314965'
          github-token: ${{ github.token }}
          path: prior
      - name: Install the actual writing pipeline
        run: python -m pip install -q -r requirements-core.txt
      - name: Replay the already edited philosophical draft
        run: |
          mkdir -p build
          cp -R prior/writing build/writing
          python scripts/replay_plan.py build --title "$TITLE" --minutes 4
      - name: Preserve the successful writing checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: edited-script
          path: build/writing/
          retention-days: 7
      - name: Direct compact shots with sentence references
        run: python story/essay.py shots --dir build/writing
      - name: Compile the exact narration and validated shot plan
        run: python story/essay.py merge --dir build/writing --out build/film.json
      - name: Publish actual writing evidence, including failures
        if: always()
        run: |
          git fetch origin previews
          git worktree add -b writing-inspection "$RUNNER_TEMP/writing" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/writing/previews/writing-$GITHUB_RUN_ID"
          cp -r build/* "$RUNNER_TEMP/writing/previews/writing-$GITHUB_RUN_ID/"
          cd "$RUNNER_TEMP/writing"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "previews/writing-$GITHUB_RUN_ID"
          git commit -m "Actual bounded writing evidence $GITHUB_RUN_ID"
          git pull --rebase origin previews
          git push origin HEAD:previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-topic-writing
          path: build/
          retention-days: 7
